name: Verify desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run test:desktop
      - run: npm run test:backend
      - run: npm run build
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
      - run: npm run test:backend
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-loop-windows-x64
          path: release/*.exe
          if-no-files-found: error
  tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run build:backend
      - run: node scripts/runtime.mjs
      - run: npm run build --workspace apps/desktop
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Verify Rust shell with the real Java engine
        shell: pwsh
        run: |
          $env:COVERAGE_TEST_ENGINE_JAR = (Resolve-Path backend/target/coverage-loop-engine.jar).Path
          cargo test --locked --lib --no-default-features --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run package:tauri
      - name: Install and launch the packaged application
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/tauri-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-loop-tauri-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-loop-tauri-smoke
          path: tauri-smoke.*
  package-comparison:
    runs-on: ubuntu-latest
    needs: [windows-package, tauri-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-loop-*-x64
          path: package-artifacts
      - run: node scripts/package-sizes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-loop-package-comparison
          path: package-sizes.*
